name: Render

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      composition:
        description: "ID da composição"
        default: "Intro"
        required: true

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSITION: ${{ github.event.inputs.composition || 'Intro' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependências do Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 fonts-noto-color-emoji

      - run: npx remotion browser ensure

      - name: Render 1080p
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMPOSITION" "out/${COMPOSITION}_1080p.mp4" \
            --codec=h264 --crf=18 --audio-bitrate=320k --concurrency=100% --log=info

      - name: Prévia 720p
        run: |
          ffmpeg -y -i "out/${COMPOSITION}_1080p.mp4" -vf scale=1280:-2 -c:v libx264 -crf 24 -preset veryfast -c:a aac -b:a 160k "out/${COMPOSITION}_720p_preview.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION }}-${{ github.sha }}
          path: out/*.mp4
          retention-days: 14
